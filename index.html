<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉他節奏積木序列器</title>
  <style>
    :root {
      --bg: #121418;
      --card-bg: #1a1e26;
      --accent: #ff8400;
      --accent-active: #22c55e;
      --accent-chord: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #8492a6;
      --border: #2d3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 980px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header { text-align: center; }
    h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 4px; }
    p.sub { font-size: 0.85rem; color: var(--text-muted); }

    /* 控制面板 */
    .controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .btn-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      background: #252d3d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #323d52; }
    button.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    button.primary.playing {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      margin-left: 6px;
    }
    .checkbox-label input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

    .bpm-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    input[type=range] { accent-color: var(--accent); cursor: pointer; }

    /* 和弦軌道區域 */
    .chord-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chord-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .selector-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select {
      background: #252d3d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .measure-indicator {
      font-weight: 700;
      color: var(--accent-chord);
      transition: color 0.15s ease;
    }
    .measure-indicator.count-in {
      color: var(--accent);
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    /* 4 個小節卡片 */
    .chord-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .measure-card {
      background: #151922;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      transition: all 0.15s ease;
    }
    .measure-card.active-measure {
      border-color: var(--accent-chord);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .measure-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .measure-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 700;
    }
    .split-btn {
      background: #252d3d;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 6px;
      font-size: 0.65rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .split-btn:hover { color: var(--text); background: #323d52; }
    .split-btn.active {
      background: var(--accent-chord);
      color: #000;
      border-color: var(--accent-chord);
    }

    /* 和弦方塊 */
    .chord-slots-container {
      display: flex;
      gap: 6px;
      height: 48px;
    }
    .chord-box {
      flex: 1;
      background: #202634;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.15s ease;
    }
    .chord-box.active-chord {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-chord);
      box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.3);
    }
    .chord-input {
      width: 90%;
      background: transparent;
      border: none;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    .chord-input:focus { border-bottom: 1px solid var(--accent-chord); }
    .chord-beat-hint {
      position: absolute;
      bottom: 2px;
      font-size: 0.55rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* 4 拍積木小節軌道區 */
    .measure-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .beat-slot {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: 12px;
      min-height: 155px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .beat-slot.drag-over { border-color: var(--accent); background: #263043; }
    .beat-slot.active {
      border-color: var(--accent-active);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.35);
      transform: translateY(-2px);
    }
    .beat-slot.countin-active {
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(255, 132, 0, 0.5);
      transform: translateY(-2px);
    }
    .beat-number {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* 模塊樣式 */
    .rhythm-block {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
    }
    .svg-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2px 0;
    }
    .strum-row {
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--text-muted);
    }
    .strum-row span.hit { color: var(--accent); font-weight: bold; }
    .label-code { font-size: 0.75rem; color: #94a3b8; font-weight: 600; font-family: monospace; }

    /* 模塊庫區 */
    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .palette-title { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .palette-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      transition: all 0.15s ease;
    }
    .palette-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .palette-item:active { cursor: grabbing; }
    .preset-num {
      align-self: flex-start;
      font-size: 0.65rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>吉他十六分節奏積木</h1>
    <p class="sub">16 種全細分 ＋ 八分三連音 × 4 小節和弦進行循環</p>
  </header>

  <!-- 全域控制面板 -->
  <div class="controls">
    <div class="btn-group">
      <button id="playBtn" class="primary">播放 ▶</button>
      <button id="randomBtn">隨機 🎲</button>
      <button id="clearBtn">重設 (四分音符)</button>
      <label class="checkbox-label">
        <input type="checkbox" id="countInCheck" checked>
        <span>4 拍預備音</span>
      </label>
    </div>
    <div class="bpm-wrapper">
      <span>BPM: <span id="bpmVal">90</span></span>
      <input type="range" id="bpmSlider" min="40" max="180" value="90">
    </div>
  </div>

  <!-- 和弦軌道區域 -->
  <div class="chord-section">
    <div class="chord-toolbar">
      <div class="selector-group">
        <span>調性:</span>
        <select id="keySelect">
          <option value="C">C 大調</option>
          <option value="G">G 大調</option>
          <option value="D">D 大調</option>
          <option value="A">A 大調</option>
          <option value="E">E 大調</option>
          <option value="F">F 大調</option>
          <option value="Bb">B♭ 大調</option>
          <option value="Am">A 小調</option>
          <option value="Em">E 小調</option>
        </select>
        <span>套路:</span>
        <select id="progSelect">
          <option value="4536">流行 4536 (IV - V - IIIm - VIm)</option>
          <option value="1645">民謠金曲 (I - VIm - IV - V)</option>
          <option value="1564">王道流行 (I - V - VIm - IV)</option>
          <option value="6415">抒情進行 (VIm - IV - I - V)</option>
          <option value="canon_split">卡農進行 (含半小節換和弦)</option>
          <option value="funk">放克律動 (I7 - IV7 - I7 - V7)</option>
        </select>
      </div>
      <div>
        <span>當前循環小節: </span>
        <span class="measure-indicator" id="measureIndicator">MEASURE 1 / 4</span>
      </div>
    </div>

    <!-- 4 個小節卡片 -->
    <div class="chord-grid" id="chordGrid"></div>
  </div>

  <!-- 4 拍積木小節軌道區 -->
  <div class="measure-grid" id="measureGrid">
    <div class="beat-slot" data-slot="0"><span class="beat-number">BEAT 1</span></div>
    <div class="beat-slot" data-slot="1"><span class="beat-number">BEAT 2</span></div>
    <div class="beat-slot" data-slot="2"><span class="beat-number">BEAT 3</span></div>
    <div class="beat-slot" data-slot="3"><span class="beat-number">BEAT 4</span></div>
  </div>

  <!-- 模塊庫區 (1~17 號) -->
  <div>
    <div class="palette-header">
      <span class="palette-title">點擊或拖曳模塊至上方 4 拍：</span>
    </div>
    <div class="palette-grid" id="paletteGrid"></div>
  </div>
</div>

<script>
  // 模塊定義：17 號為三連音，其餘為 16 種細分
  const RHYTHM_PRESETS = [
    { id: 1,  isTriplet: false, pattern: [1, 0, 0, 0], desc: "1 _ _ _", name: "四分音符" },
    { id: 2,  isTriplet: false, pattern: [1, 0, 1, 0], desc: "1 _ 3 _", name: "雙八分" },
    { id: 3,  isTriplet: false, pattern: [1, 1, 1, 1], desc: "1 2 3 4", name: "四個十六分" },
    { id: 4,  isTriplet: false, pattern: [1, 0, 1, 1], desc: "1 _ 3 4", name: "前八後十六" },
    { id: 5,  isTriplet: false, pattern: [1, 1, 1, 0], desc: "1 2 3 _", name: "前十六後八" },
    { id: 6,  isTriplet: false, pattern: [1, 1, 0, 1], desc: "1 2 _ 4", name: "夾心十六" },
    { id: 7,  isTriplet: false, pattern: [1, 0, 0, 1], desc: "1 _ _ 4", name: "前附點八分" },
    { id: 8,  isTriplet: false, pattern: [1, 1, 0, 0], desc: "1 2 _ _", name: "前半雙十六+八分休" },
    { id: 9,  isTriplet: false, pattern: [0, 0, 0, 0], desc: "_ _ _ _", name: "四分休止" },
    { id: 10, isTriplet: false, pattern: [0, 1, 0, 0], desc: "_ 2 _ _", name: "十六休+十六+八休" },
    { id: 11, isTriplet: false, pattern: [0, 0, 1, 0], desc: "_ _ 3 _", name: "八分休+八分音" },
    { id: 12, isTriplet: false, pattern: [0, 0, 0, 1], desc: "_ _ _ 4", name: "附點八分休+十六" },
    { id: 13, isTriplet: false, pattern: [0, 1, 1, 0], desc: "_ 2 3 _", name: "中雙十六+前後休" },
    { id: 14, isTriplet: false, pattern: [0, 1, 0, 1], desc: "_ 2 _ 4", name: "交替雙反拍十六" },
    { id: 15, isTriplet: false, pattern: [0, 0, 1, 1], desc: "_ _ 3 4", name: "八分休+雙十六" },
    { id: 16, isTriplet: false, pattern: [0, 1, 1, 1], desc: "_ 2 3 4", name: "十六休+後三連十六" },
    { id: 17, isTriplet: true,  pattern: [1, 1, 1],    desc: "3 連音",  name: "八分三連音" },
  ];

  const standardStrum = ["↓", "↑", "↓", "↑"];

  // 樂理繪圖
  function drawRest8(x, y) {
    return `
      <g transform="translate(${x}, ${y}) scale(0.9)">
        <circle cx="-1" cy="-5" r="2.2" fill="#94a3b8"/>
        <path d="M -1,-2.8 C 1.5,-2.8 3,-0.5 1,2.5 L -3,13.5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
      </g>
    `;
  }

  function drawRest16(x, y) {
    return `
      <g transform="translate(${x}, ${y}) scale(0.9)">
        <circle cx="-1" cy="-9" r="2" fill="#94a3b8"/>
        <path d="M -1,-7 C 1.5,-7 2.8,-5.5 1,-3" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="-1" cy="-2" r="2" fill="#94a3b8"/>
        <path d="M -1,0 C 1.5,0 2.8,1.5 1,4 L -3,14" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </g>
    `;
  }

  function drawRestQuarter(x, y) {
    return `
      <g transform="translate(${x}, ${y})">
        <path d="M -3,-14 L 3,-6 L -3,1 L 3,7 C 1,11 -2,14 1,17" 
              stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    `;
  }

  function drawNote(x, headY, stemTop) {
    return `
      <ellipse cx="${x}" cy="${headY}" rx="4.5" ry="3.3" transform="rotate(-18 ${x} ${headY})" fill="#f1f5f9"/>
      <line x1="${x+4.1}" y1="${headY}" x2="${x+4.1}" y2="${stemTop}" stroke="#f1f5f9" stroke-width="2"/>
    `;
  }

  function drawTripletSVG() {
    const tx = [22, 55, 88];
    const top = 14;
    const hY = 40;
    return `
      <line x1="${tx[0]+4.1}" y1="${top}" x2="${tx[2]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>
      ${tx.map(x => drawNote(x, hY, top)).join('')}
      <text x="56" y="9" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ff8400" text-anchor="middle">3</text>
    `;
  }

  function generateCleanNotationSVG(id) {
    if (id === 17) return `<svg viewBox="0 0 110 56" width="110" height="56">${drawTripletSVG()}</svg>`;

    const x = [16, 42, 68, 94];
    const top = 10;
    const b2 = 16;
    const hY = 40;
    const rY = 26;

    let c = '';
    switch(id) {
      case 1: c += drawNote(55, hY, 12); break;
      case 2:
        c += `<line x1="${x[0]+4.1}" y1="${top}" x2="${x[2]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += drawNote(x[0], hY, top) + drawNote(x[2], hY, top);
        break;
      case 3:
        c += `<line x1="${x[0]+4.1}" y1="${top}" x2="${x[3]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[0]+4.1}" y1="${b2}" x2="${x[3]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        x.forEach(pos => { c += drawNote(pos, hY, top); });
        break;
      case 4:
        c += `<line x1="${x[0]+4.1}" y1="${top}" x2="${x[3]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[2]+4.1}" y1="${b2}" x2="${x[3]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[0], hY, top) + drawNote(x[2], hY, top) + drawNote(x[3], hY, top);
        break;
      case 5:
        c += `<line x1="${x[0]+4.1}" y1="${top}" x2="${x[2]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[0]+4.1}" y1="${b2}" x2="${x[1]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[0], hY, top) + drawNote(x[1], hY, top) + drawNote(x[2], hY, top);
        break;
      case 6:
        c += `<line x1="${x[0]+4.1}" y1="${top}" x2="${x[1]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[0]+4.1}" y1="${b2}" x2="${x[1]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[0], hY, top) + drawNote(x[1], hY, top) + drawRest16(x[2], rY) + drawNote(x[3], hY, 12);
        c += `<line x1="${x[3]+4.1}" y1="12" x2="${x[3]+11}" y2="16" stroke="#f1f5f9" stroke-width="2.2"/>`;
        c += `<line x1="${x[3]+4.1}" y1="17" x2="${x[3]+11}" y2="21" stroke="#f1f5f9" stroke-width="2.2"/>`;
        break;
      case 7:
        c += `<line x1="${x[0]+4.1}" y1="${top}" x2="${x[3]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[3]+4.1}" y1="${b2}" x2="${x[3]-7}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[0], hY, top) + `<circle cx="${x[0]+11}" cy="${hY}" r="2" fill="#f1f5f9"/>` + drawNote(x[3], hY, top);
        break;
      case 8:
        c += `<line x1="${x[0]+4.1}" y1="${top}" x2="${x[1]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[0]+4.1}" y1="${b2}" x2="${x[1]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[0], hY, top) + drawNote(x[1], hY, top) + drawRest8(81, rY);
        break;
      case 9: c += drawRestQuarter(55, rY); break;
      case 10:
        c += drawRest16(x[0], rY) + drawNote(x[1], hY, 12);
        c += `<line x1="${x[1]+4.1}" y1="12" x2="${x[1]+11}" y2="16" stroke="#f1f5f9" stroke-width="2.2"/>`;
        c += `<line x1="${x[1]+4.1}" y1="17" x2="${x[1]+11}" y2="21" stroke="#f1f5f9" stroke-width="2.2"/>`;
        c += drawRest8(81, rY);
        break;
      case 11:
        c += drawRest8(29, rY) + drawNote(x[2], hY, 12);
        c += `<line x1="${x[2]+4.1}" y1="12" x2="${x[2]+10}" y2="18" stroke="#f1f5f9" stroke-width="2.2"/>`;
        break;
      case 12:
        c += drawRest8(40, rY) + `<circle cx="50" cy="${rY+6}" r="2" fill="#94a3b8"/>` + drawNote(x[3], hY, 12);
        c += `<line x1="${x[3]+4.1}" y1="12" x2="${x[3]+11}" y2="16" stroke="#f1f5f9" stroke-width="2.2"/>`;
        c += `<line x1="${x[3]+4.1}" y1="17" x2="${x[3]+11}" y2="21" stroke="#f1f5f9" stroke-width="2.2"/>`;
        break;
      case 13:
        c += drawRest16(x[0], rY);
        c += `<line x1="${x[1]+4.1}" y1="${top}" x2="${x[2]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[1]+4.1}" y1="${b2}" x2="${x[2]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[1], hY, top) + drawNote(x[2], hY, top) + drawRest16(x[3], rY);
        break;
      case 14:
        c += drawRest16(x[0], rY) + drawNote(x[1], hY, 12);
        c += `<line x1="${x[1]+4.1}" y1="12" x2="${x[1]+11}" y2="16" stroke="#f1f5f9" stroke-width="2.2"/>`;
        c += `<line x1="${x[1]+4.1}" y1="17" x2="${x[1]+11}" y2="21" stroke="#f1f5f9" stroke-width="2.2"/>`;
        c += drawRest16(x[2], rY) + drawNote(x[3], hY, 12);
        c += `<line x1="${x[3]+4.1}" y1="12" x2="${x[3]+11}" y2="16" stroke="#f1f5f9" stroke-width="2.2"/>`;
        c += `<line x1="${x[3]+4.1}" y1="17" x2="${x[3]+11}" y2="21" stroke="#f1f5f9" stroke-width="2.2"/>`;
        break;
      case 15:
        c += drawRest8(29, rY);
        c += `<line x1="${x[2]+4.1}" y1="${top}" x2="${x[3]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[2]+4.1}" y1="${b2}" x2="${x[3]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[2], hY, top) + drawNote(x[3], hY, top);
        break;
      case 16:
        c += drawRest16(x[0], rY);
        c += `<line x1="${x[1]+4.1}" y1="${top}" x2="${x[3]+4.1}" y2="${top}" stroke="#f1f5f9" stroke-width="3"/>`;
        c += `<line x1="${x[1]+4.1}" y1="${b2}" x2="${x[3]+4.1}" y2="${b2}" stroke="#f1f5f9" stroke-width="2.5"/>`;
        c += drawNote(x[1], hY, top) + drawNote(x[2], hY, top) + drawNote(x[3], hY, top);
        break;
    }
    return `<svg viewBox="0 0 110 56" width="110" height="56">${c}</svg>`;
  }

  // --- 和弦進行與調性引擎 ---
  const CHORD_DEGREE_MAPS = {
    "C":  { I: "C",  IIm: "Dm", IIIm: "Em", IV: "F",  V: "G",  VIm: "Am", I7: "C7", IV7: "F7", V7: "G7" },
    "G":  { I: "G",  IIm: "Am", IIIm: "Bm", IV: "C",  V: "D",  VIm: "Em", I7: "G7", IV7: "C7", V7: "D7" },
    "D":  { I: "D",  IIm: "Em", IIIm: "F#m",IV: "G",  V: "A",  VIm: "Bm", I7: "D7", IV7: "G7", V7: "A7" },
    "A":  { I: "A",  IIm: "Bm", IIIm: "C#m",IV: "D",  V: "E",  VIm: "F#m",I7: "A7", IV7: "D7", V7: "E7" },
    "E":  { I: "E",  IIm: "F#m",IIIm: "G#m",IV: "A",  V: "B",  VIm: "C#m",I7: "E7", IV7: "A7", V7: "B7" },
    "F":  { I: "F",  IIm: "Gm", IIIm: "Am", IV: "Bb", V: "C",  VIm: "Dm", I7: "F7", IV7: "Bb7",V7: "C7" },
    "Bb": { I: "Bb", IIm: "Cm", IIIm: "Dm", IV: "Eb", V: "F",  VIm: "Gm", I7: "Bb7",IV7: "Eb7",V7: "F7" },
    "Am": { I: "Am", IIm: "Bdim",IIIm:"C",  IV: "Dm", V: "Em", VIm: "F",  I7: "Am7",IV7: "Dm7",V7: "E7" },
    "Em": { I: "Em", IIm: "F#dim",IIIm:"G", IV: "Am", V: "Bm", VIm: "C",  I7: "Em7",IV7: "Am7",V7: "B7" }
  };

  const PRESET_PROGRESSIONS = {
    "4536": [{ split: false, chords: ["IV"] }, { split: false, chords: ["V"] }, { split: false, chords: ["IIIm"] }, { split: false, chords: ["VIm"] }],
    "1645": [{ split: false, chords: ["I"] }, { split: false, chords: ["VIm"] }, { split: false, chords: ["IV"] }, { split: false, chords: ["V"] }],
    "1564": [{ split: false, chords: ["I"] }, { split: false, chords: ["V"] }, { split: false, chords: ["VIm"] }, { split: false, chords: ["IV"] }],
    "6415": [{ split: false, chords: ["VIm"] }, { split: false, chords: ["IV"] }, { split: false, chords: ["I"] }, { split: false, chords: ["V"] }],
    "canon_split": [{ split: true, chords: ["I", "V"] }, { split: true, chords: ["VIm", "IIIm"] }, { split: true, chords: ["IV", "I"] }, { split: true, chords: ["IV", "V"] }],
    "funk": [{ split: false, chords: ["I7"] }, { split: false, chords: ["IV7"] }, { split: false, chords: ["I7"] }, { split: false, chords: ["V7"] }]
  };

  let chordState = [
    { split: false, chords: ["F", ""] },
    { split: false, chords: ["G", ""] },
    { split: false, chords: ["Em", ""] },
    { split: false, chords: ["Am", ""] }
  ];

  function applyProgression(key, progKey) {
    const map = CHORD_DEGREE_MAPS[key] || CHORD_DEGREE_MAPS["C"];
    const prog = PRESET_PROGRESSIONS[progKey];
    if (!prog) return;

    chordState = prog.map(item => ({
      split: item.split,
      chords: item.chords.map(deg => map[deg] || deg)
    }));
    renderChords();
  }

  const chordGrid = document.getElementById("chordGrid");
  function renderChords() {
    chordGrid.innerHTML = "";
    chordState.forEach((item, mIdx) => {
      const card = document.createElement("div");
      card.className = "measure-card";
      card.id = `measure-card-${mIdx}`;

      const header = document.createElement("div");
      header.className = "measure-header";
      header.innerHTML = `
        <span class="measure-title">M${mIdx + 1}</span>
        <button class="split-btn ${item.split ? 'active' : ''}" data-midx="${mIdx}">${item.split ? '單一' : '½ 拆分'}</button>
      `;

      const slotsContainer = document.createElement("div");
      slotsContainer.className = "chord-slots-container";

      if (!item.split) {
        slotsContainer.innerHTML = `
          <div class="chord-box" id="chord-box-${mIdx}-0">
            <input type="text" class="chord-input" value="${item.chords[0] || ''}" data-midx="${mIdx}" data-subidx="0">
            <span class="chord-beat-hint">1-4 拍</span>
          </div>
        `;
      } else {
        slotsContainer.innerHTML = `
          <div class="chord-box" id="chord-box-${mIdx}-0">
            <input type="text" class="chord-input" value="${item.chords[0] || ''}" data-midx="${mIdx}" data-subidx="0">
            <span class="chord-beat-hint">1-2 拍</span>
          </div>
          <div class="chord-box" id="chord-box-${mIdx}-1">
            <input type="text" class="chord-input" value="${item.chords[1] || ''}" data-midx="${mIdx}" data-subidx="1">
            <span class="chord-beat-hint">3-4 拍</span>
          </div>
        `;
      }

      card.appendChild(header);
      card.appendChild(slotsContainer);
      chordGrid.appendChild(card);
    });

    document.querySelectorAll(".split-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const mIdx = parseInt(e.target.dataset.midx);
        chordState[mIdx].split = !chordState[mIdx].split;
        if (chordState[mIdx].split && !chordState[mIdx].chords[1]) {
          chordState[mIdx].chords[1] = chordState[mIdx].chords[0];
        }
        renderChords();
      });
    });

    document.querySelectorAll(".chord-input").forEach(input => {
      input.addEventListener("change", (e) => {
        const mIdx = parseInt(e.target.dataset.midx);
        const subIdx = parseInt(e.target.dataset.subidx);
        chordState[mIdx].chords[subIdx] = e.target.value.trim();
      });
    });
  }

  const keySelect = document.getElementById("keySelect");
  const progSelect = document.getElementById("progSelect");
  keySelect.addEventListener("change", () => applyProgression(keySelect.value, progSelect.value));
  progSelect.addEventListener("change", () => applyProgression(keySelect.value, progSelect.value));

  // --- 4 拍積木軌道與庫 ---
  let measureState = [
    { ...RHYTHM_PRESETS[0] },
    { ...RHYTHM_PRESETS[0] },
    { ...RHYTHM_PRESETS[0] },
    { ...RHYTHM_PRESETS[0] }
  ];
  let selectedSlotIndex = 0;

  function createBlockElement(preset, draggable = true) {
    const el = document.createElement("div");
    el.className = "rhythm-block";
    if (draggable) {
      el.draggable = true;
      el.dataset.presetId = preset.id;
    }

    // 正確判斷撥弦指示：有彈奏才顯示箭頭，休止顯示為點 "·"
    let strumHtml = '';
    if (preset.isTriplet) {
      strumHtml = `
        <span class="hit">↓</span>
        <span class="hit">↓</span>
        <span class="hit">↓</span>
      `;
    } else {
      strumHtml = preset.pattern.map((hit, idx) => `
        <span class="${hit ? 'hit' : ''}">${hit ? standardStrum[idx] : '·'}</span>
      `).join("");
    }

    el.innerHTML = `
      <div class="svg-container">${generateCleanNotationSVG(preset.id)}</div>
      <div class="strum-row">${strumHtml}</div>
      <div class="label-code">${preset.desc}</div>
    `;

    if (draggable) {
      el.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", preset.id);
      });
    }
    return el;
  }

  const paletteGrid = document.getElementById("paletteGrid");
  RHYTHM_PRESETS.forEach((preset) => {
    const item = document.createElement("div");
    item.className = "palette-item";
    item.draggable = true;

    // 所有項目維持統一圓形編號 (包括 17)
    const numBadge = document.createElement("div");
    numBadge.className = "preset-num";
    numBadge.innerText = preset.id;
    item.appendChild(numBadge);

    item.appendChild(createBlockElement(preset, false));

    item.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", preset.id);
    });

    item.addEventListener("click", () => {
      assignPresetToSlot(selectedSlotIndex, preset.id);
      selectedSlotIndex = (selectedSlotIndex + 1) % 4;
      renderSlots();
    });

    paletteGrid.appendChild(item);
  });

  const slots = document.querySelectorAll(".beat-slot");
  function renderSlots() {
    slots.forEach((slot, index) => {
      const preset = measureState[index];
      slot.innerHTML = `<span class="beat-number">BEAT ${index + 1}</span>`;
      const blockEl = createBlockElement(preset, true);
      slot.appendChild(blockEl);
      slot.style.borderColor = (index === selectedSlotIndex) ? "var(--accent)" : "";
    });
  }

  function assignPresetToSlot(slotIndex, presetId) {
    const preset = RHYTHM_PRESETS.find(p => p.id === parseInt(presetId));
    if (preset) measureState[slotIndex] = { ...preset };
  }

  slots.forEach(slot => {
    const slotIdx = parseInt(slot.dataset.slot);
    slot.addEventListener("click", () => {
      selectedSlotIndex = slotIdx;
      renderSlots();
    });
    slot.addEventListener("dragover", (e) => {
      e.preventDefault();
      slot.classList.add("drag-over");
    });
    slot.addEventListener("dragleave", () => {
      slot.classList.remove("drag-over");
    });
    slot.addEventListener("drop", (e) => {
      e.preventDefault();
      slot.classList.remove("drag-over");
      const presetId = e.dataTransfer.getData("text/plain");
      if (presetId) {
        assignPresetToSlot(slotIdx, presetId);
        selectedSlotIndex = slotIdx;
        renderSlots();
      }
    });
  });

  // --- Web Audio 節拍引擎 ---
  let audioCtx = null;
  let isPlaying = false;
  let bpm = 90;
  let currentMeasure = 0;
  let currentBeat = 0;
  let nextBeatTime = 0.0;
  let timerID = null;

  let isCountingIn = false;
  let countInBeat = 0;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(time, freq, gainVal, decay = 0.04) {
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.frequency.setValueAtTime(freq, time);
    gainNode.gain.setValueAtTime(gainVal, time);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, time + decay);

    osc.start(time);
    osc.stop(time + decay);
  }

  function updateVisuals(measureIdx, beatIdx) {
    const indicator = document.getElementById("measureIndicator");
    indicator.classList.remove("count-in");
    indicator.innerText = `MEASURE ${measureIdx + 1} / 4`;

    document.querySelectorAll(".measure-card").forEach((card, idx) => {
      card.classList.toggle("active-measure", idx === measureIdx);
    });

    document.querySelectorAll(".chord-box").forEach(box => box.classList.remove("active-chord"));
    const currentMData = chordState[measureIdx];
    if (!currentMData.split) {
      const activeBox = document.getElementById(`chord-box-${measureIdx}-0`);
      if (activeBox) activeBox.classList.add("active-chord");
    } else {
      const subIdx = (beatIdx < 2) ? 0 : 1;
      const activeBox = document.getElementById(`chord-box-${measureIdx}-${subIdx}`);
      if (activeBox) activeBox.classList.add("active-chord");
    }

    slots.forEach((s, idx) => {
      s.classList.remove("countin-active");
      s.classList.toggle("active", idx === beatIdx);
    });
  }

  function updateCountInVisuals(beatIdx) {
    const indicator = document.getElementById("measureIndicator");
    indicator.classList.add("count-in");
    indicator.innerText = `READY: ${beatIdx + 1} / 4`;

    document.querySelectorAll(".measure-card").forEach(c => c.classList.remove("active-measure"));
    document.querySelectorAll(".chord-box").forEach(b => b.classList.remove("active-chord"));

    slots.forEach((s, idx) => {
      s.classList.remove("active");
      s.classList.toggle("countin-active", idx === beatIdx);
    });
  }

  function scheduleBeat(measureIdx, beatIdx, startTime, beatDuration) {
    const preset = measureState[beatIdx];

    if (preset.isTriplet) {
      const subDuration = beatDuration / 3.0;
      for (let i = 0; i < 3; i++) {
        const noteTime = startTime + i * subDuration;
        if (i === 0) {
          let freq = 700;
          if (beatIdx === 0) freq = (measureIdx === 0) ? 1100 : 850;
          playTone(noteTime, freq, 0.65, 0.05);
        } else {
          playTone(noteTime, 540, 0.28, 0.03);
        }
      }
    } else {
      const subDuration = beatDuration / 4.0;
      for (let i = 0; i < 4; i++) {
        if (preset.pattern[i] === 1) {
          const noteTime = startTime + i * subDuration;
          if (i === 0) {
            let freq = 700;
            if (beatIdx === 0) freq = (measureIdx === 0) ? 1100 : 850;
            playTone(noteTime, freq, 0.65, 0.05);
          } else {
            playTone(noteTime, 480, 0.25, 0.03);
          }
        }
      }
    }

    const drawTime = (startTime - audioCtx.currentTime) * 1000;
    setTimeout(() => {
      if (!isPlaying || isCountingIn) return;
      updateVisuals(measureIdx, beatIdx);
    }, Math.max(0, drawTime));
  }

  function scheduleCountIn(beatIdx, time) {
    const freq = (beatIdx === 0) ? 1300 : 950;
    playTone(time, freq, 0.75, 0.06);

    const drawTime = (time - audioCtx.currentTime) * 1000;
    setTimeout(() => {
      if (!isPlaying || !isCountingIn) return;
      updateCountInVisuals(beatIdx);
    }, Math.max(0, drawTime));
  }

  function scheduler() {
    while (nextBeatTime < audioCtx.currentTime + 0.1) {
      const secondsPerBeat = 60.0 / bpm;

      if (isCountingIn) {
        scheduleCountIn(countInBeat, nextBeatTime);
        nextBeatTime += secondsPerBeat;
        countInBeat++;

        if (countInBeat >= 4) {
          isCountingIn = false;
          currentBeat = 0;
          currentMeasure = 0;
        }
      } else {
        scheduleBeat(currentMeasure, currentBeat, nextBeatTime, secondsPerBeat);
        nextBeatTime += secondsPerBeat;

        currentBeat++;
        if (currentBeat >= 4) {
          currentBeat = 0;
          currentMeasure = (currentMeasure + 1) % 4;
        }
      }
    }
    timerID = setTimeout(scheduler, 25.0);
  }

  // 控制按鈕
  const playBtn = document.getElementById("playBtn");
  const countInCheck = document.getElementById("countInCheck");

  playBtn.addEventListener("click", () => {
    initAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();

    isPlaying = !isPlaying;
    if (isPlaying) {
      isCountingIn = countInCheck.checked;
      countInBeat = 0;
      currentBeat = 0;
      currentMeasure = 0;
      nextBeatTime = audioCtx.currentTime + 0.05;
      scheduler();
      playBtn.innerText = "停止 ■";
      playBtn.classList.add("playing");
    } else {
      clearTimeout(timerID);
      playBtn.innerText = "播放 ▶";
      playBtn.classList.remove("playing");
      slots.forEach(s => {
        s.classList.remove("active");
        s.classList.remove("countin-active");
      });
      document.querySelectorAll(".measure-card").forEach(c => c.classList.remove("active-measure"));
      document.querySelectorAll(".chord-box").forEach(b => b.classList.remove("active-chord"));
      const indicator = document.getElementById("measureIndicator");
      indicator.classList.remove("count-in");
      indicator.innerText = "MEASURE 1 / 4";
    }
  });

  const bpmSlider = document.getElementById("bpmSlider");
  const bpmVal = document.getElementById("bpmVal");
  bpmSlider.addEventListener("input", (e) => {
    bpm = parseInt(e.target.value);
    bpmVal.innerText = bpm;
  });

  document.getElementById("randomBtn").addEventListener("click", () => {
    for (let i = 0; i < 4; i++) {
      const randIndex = Math.floor(Math.random() * RHYTHM_PRESETS.length);
      measureState[i] = { ...RHYTHM_PRESETS[randIndex] };
    }
    renderSlots();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    measureState = [
      { ...RHYTHM_PRESETS[0] },
      { ...RHYTHM_PRESETS[0] },
      { ...RHYTHM_PRESETS[0] },
      { ...RHYTHM_PRESETS[0] }
    ];
    renderSlots();
  });

  applyProgression("C", "4536");
  renderSlots();
</script>

</body>
